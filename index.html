<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 아카이브 - 스마트 북마크</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 transition-colors duration-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-gradient-to-br from-brand-500 to-amber-500 text-white rounded-xl shadow-md shadow-brand-500/20">
                        <i data-lucide="bookmark" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight text-slate-900 dark:text-white">Quick Link Archive</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">나만의 웹 링크 보관소</p>
                    </div>
                </div>

                <!-- Right Controls -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <!-- Sync Account Info Button -->
                    <button id="authBtn" onclick="openAuthModal()" class="flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg border border-brand-200 dark:border-slate-700 bg-brand-50/50 dark:bg-slate-700/50 hover:bg-brand-100 dark:hover:bg-slate-700 text-brand-700 dark:text-brand-500 transition">
                        <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                        <span id="authBtnText">동기화 연동됨</span>
                    </button>

                    <!-- Category Manager Button -->
                    <button onclick="openCategoryModal()" class="flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition">
                        <i data-lucide="folder-cog" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">카테고리 관리</span>
                    </button>

                    <!-- Add Bookmark Button -->
                    <button onclick="openAddModal()" class="flex items-center space-x-1 px-3 py-1.5 text-xs font-semibold text-white bg-brand-500 hover:bg-brand-600 rounded-lg shadow-sm transition shadow-brand-500/10">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">링크 추가</span>
                    </button>

                    <!-- Dark Mode Toggle -->
                    <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        <!-- Search & Filter Controls -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Category Tabs -->
            <div id="categoryTabs" class="flex flex-wrap gap-1.5 w-full md:w-auto">
                <!-- Dynamically generated -->
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-64">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderBookmarks()" placeholder="링크 또는 태그 검색..." 
                    class="w-full pl-9 pr-4 py-1.5 text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
            </div>
        </div>

        <!-- Bookmarks Grid -->
        <div id="bookmarkGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Dynamically generated -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="p-4 bg-brand-50 dark:bg-slate-800 text-brand-500 rounded-full mb-3">
                <i data-lucide="bookmark-x" class="w-8 h-8"></i>
            </div>
            <h3 class="font-semibold text-slate-700 dark:text-slate-300">표시할 링크가 없습니다</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">새로운 웹사이트를 등록해보세요.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 mt-auto transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400 space-y-1">
            <p>© 김망고. All rights reserved. — My Personal Web Archive</p>
        </div>
    </footer>

    <!-- Add/Edit Bookmark Modal -->
    <div id="bookmarkModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-900 dark:text-white">새 링크 추가</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="bookmarkForm" onsubmit="handleSaveBookmark(event)" class="space-y-3">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">사이트 이름</label>
                    <input type="text" id="bmTitle" required placeholder="예: 네이버" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">URL 주소</label>
                    <input type="url" id="bmUrl" required placeholder="https://www.example.com" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">카테고리</label>
                    <select id="bmCategory" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">메모 (선택)</label>
                    <input type="text" id="bmDesc" placeholder="간단한 사이트 설명..." class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">취소</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition shadow-sm">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Manager Modal -->
    <div id="categoryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white">카테고리 관리</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="flex space-x-2">
                <input type="text" id="newCategoryInput" placeholder="새 카테고리 이름" class="flex-1 px-3 py-1.5 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                <button onclick="handleAddCategory()" class="px-3 py-1.5 text-xs font-semibold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition">추가</button>
            </div>

            <div id="categoryManageList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Auth & Sync Modal -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center space-x-2">
                    <i data-lucide="cloud" class="w-5 h-5 text-brand-500"></i>
                    <span>로그인 및 기기 동기화</span>
                </h3>
                <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-3 bg-brand-50 dark:bg-slate-700/40 rounded-xl space-y-1 border border-brand-100 dark:border-slate-700">
                <span class="text-xs font-semibold text-brand-600 dark:text-brand-500">현재 동기화 계정 정보</span>
                <div class="flex items-center justify-between">
                    <span id="currentSyncId" class="font-mono text-sm font-bold text-slate-800 dark:text-slate-200 truncate pr-2">계정 불러오는 중...</span>
                    <button onclick="copySyncCode()" class="px-2 py-1 text-xs bg-brand-500 text-white font-semibold rounded hover:bg-brand-600 transition flex items-center space-x-1 shrink-0 shadow-sm">
                        <i data-lucide="copy" class="w-3 h-3"></i>
                        <span>코드 복사</span>
                    </button>
                </div>
            </div>

            <!-- Tab Buttons -->
            <div class="flex border-b border-slate-200 dark:border-slate-700">
                <button id="tabSyncBtn" onclick="switchAuthTab('sync')" class="flex-1 py-2 text-xs font-semibold text-brand-500 border-b-2 border-brand-500">동기화 코드로 연결</button>
                <button id="tabEmailBtn" onclick="switchAuthTab('email')" class="flex-1 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600">이메일 로그인 / 회원가입</button>
            </div>

            <!-- Tab 1: Sync Code -->
            <div id="syncCodeSection" class="space-y-3">
                <p class="text-xs text-slate-500 dark:text-slate-400">다른 기기의 동기화 코드를 입력하면 저장된 북마크를 그대로 가져옵니다.</p>
                <div class="flex space-x-2">
                    <input type="text" id="targetSyncCode" placeholder="동기화 코드 입력..." class="flex-1 px-3 py-2 text-sm font-mono bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                    <button onclick="applySyncCode()" class="px-3 py-2 text-xs font-semibold text-white bg-slate-800 hover:bg-slate-900 dark:bg-slate-600 dark:hover:bg-slate-500 rounded-lg transition">연결하기</button>
                </div>
            </div>

            <!-- Tab 2: Email Auth -->
            <div id="emailAuthSection" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">이메일 주소</label>
                    <input type="email" id="authEmail" placeholder="example@email.com" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">비밀번호</label>
                    <input type="password" id="authPassword" placeholder="••••••••" class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white">
                </div>
                <div class="flex space-x-2 pt-1">
                    <button onclick="handleLogin()" class="flex-1 py-2 text-xs font-semibold text-white bg-brand-500 hover:bg-brand-600 rounded-lg transition shadow-sm">로그인</button>
                    <button onclick="handleSignUp()" class="flex-1 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded-lg transition">회원가입</button>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <button onclick="createNewSyncId()" class="text-xs text-slate-400 hover:text-slate-600 underline">내 전용 새 동기화 생성</button>
                <button onclick="closeAuthModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">닫기</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 사용자님의 실제 Firebase Config 정보가 교체 적용되었습니다.
        const firebaseConfig = {
            apiKey: "AIzaSyAmNtN_-QDODsWvlfutmvUzSUgksEUSMmE",
            authDomain: "kbookmark-26bd5.firebaseapp.com",
            projectId: "kbookmark-26bd5",
            storageBucket: "kbookmark-26bd5.firebasestorage.app",
            messagingSenderId: "315317394216",
            appId: "1:315317394216:web:538795d9951eded885ce1d",
            measurementId: "G-B25B61BCNZ"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Variables
        let state = {
            userId: localStorage.getItem('my_sync_id') || null,
            categories: ['전체', '주요 사이트', '개발', '뉴스/정보', '기타'],
            currentCategory: '전체',
            bookmarks: [
                { id: '1', title: '구글', url: 'https://www.google.com', category: '주요 사이트', desc: '검색 엔진', pinned: true },
                { id: '2', title: '네이버', url: 'https://www.naver.com', category: '주요 사이트', desc: '포털 사이트', pinned: true },
                { id: '3', title: '유튜브', url: 'https://www.youtube.com', category: '주요 사이트', desc: '동영상 시청', pinned: false },
                { id: '4', title: 'GitHub', url: 'https://github.com', category: '개발', desc: '코드 저장소', pinned: false }
            ]
        };

        let unsubscribeFirestore = null;

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            initAuth();
            renderCategories();
            renderBookmarks();
            lucide.createIcons();
        });

        // Auth Listener
        function initAuth() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    state.userId = user.email || user.uid;
                    localStorage.setItem('my_sync_id', state.userId);
                    updateAuthUI(true);
                    listenToCloudData(state.userId);
                } else {
                    const savedId = localStorage.getItem('my_sync_id');
                    if (savedId) {
                        state.userId = savedId;
                        listenToCloudData(savedId);
                    } else {
                        try {
                            const anon = await signInAnonymously(auth);
                            state.userId = anon.user.uid;
                            localStorage.setItem('my_sync_id', state.userId);
                            listenToCloudData(state.userId);
                        } catch(e) {
                            console.log("익명 로그인 사용 중:", e.message);
                        }
                    }
                    updateAuthUI(false);
                }
            });
        }

        function updateAuthUI(isEmailLoggedIn) {
            const authBtnText = document.getElementById('authBtnText');
            const syncIdText = document.getElementById('currentSyncId');
            if (syncIdText) syncIdText.textContent = state.userId || '불러오는 중...';
            if (authBtnText) authBtnText.textContent = isEmailLoggedIn ? state.userId.split('@')[0] : '동기화 연동됨';
        }

        // Firestore Realtime Listener
        function listenToCloudData(syncId) {
            if (unsubscribeFirestore) unsubscribeFirestore();
            
            const docRef = doc(db, 'user_archives', syncId);
            unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.bookmarks) state.bookmarks = data.bookmarks;
                    if (data.categories) state.categories = data.categories;
                    renderCategories();
                    renderBookmarks();
                } else {
                    saveToCloud();
                }
            }, (err) => {
                console.warn("Cloud Sync Notice:", err.message);
            });
        }

        async function saveToCloud() {
            if (!state.userId) return;
            try {
                const docRef = doc(db, 'user_archives', state.userId);
                await setDoc(docRef, {
                    bookmarks: state.bookmarks,
                    categories: state.categories,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.error("Save Error:", e);
            }
        }

        // Global functions for inline HTML events
        window.renderCategories = function() {
            const container = document.getElementById('categoryTabs');
            const select = document.getElementById('bmCategory');
            
            container.innerHTML = state.categories.map(cat => `
                <button onclick="selectCategory('${cat}')" 
                    class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
                        state.currentCategory === cat 
                        ? 'bg-brand-500 text-white shadow-sm' 
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700'
                    }">
                    ${cat}
                </button>
            `).join('');

            select.innerHTML = state.categories
                .filter(cat => cat !== '전체')
                .map(cat => `<option value="${cat}">${cat}</option>`)
                .join('');
        };

        window.renderBookmarks = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('bookmarkGrid');
            const empty = document.getElementById('emptyState');

            let filtered = state.bookmarks.filter(bm => {
                const matchCategory = state.currentCategory === '전체' || bm.category === state.currentCategory;
                const matchSearch = bm.title.toLowerCase().includes(search) || 
                                    bm.url.toLowerCase().includes(search) || 
                                    (bm.desc && bm.desc.toLowerCase().includes(search));
                return matchCategory && matchSearch;
            });

            filtered.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }

            empty.classList.add('hidden');
            empty.classList.remove('flex');

            grid.innerHTML = filtered.map(bm => `
                <div class="group bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 hover:border-brand-500 dark:hover:border-brand-500 shadow-sm hover:shadow-md transition duration-200 relative flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between mb-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-500 rounded-md border border-brand-100 dark:border-brand-500/20">
                                ${bm.category}
                            </span>
                            <div class="flex items-center space-x-1 opacity-80 group-hover:opacity-100 transition">
                                <button onclick="togglePin('${bm.id}')" class="p-1 text-slate-400 hover:text-amber-500 transition">
                                    <i data-lucide="pin" class="w-3.5 h-3.5 ${bm.pinned ? 'fill-amber-500 text-amber-500' : ''}"></i>
                                </button>
                                <button onclick="openEditModal('${bm.id}')" class="p-1 text-slate-400 hover:text-brand-500 transition">
                                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="deleteBookmark('${bm.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                        <h4 class="font-bold text-slate-800 dark:text-white text-base mb-1 group-hover:text-brand-600 dark:group-hover:text-brand-500 transition line-clamp-1">${bm.title}</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-3 min-h-[2rem]">${bm.desc || '메모 없음'}</p>
                    </div>
                    <a href="${bm.url}" target="_blank" rel="noopener" class="mt-2 w-full py-2 bg-slate-50 dark:bg-slate-700/50 hover:bg-brand-500 hover:text-white text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-lg flex items-center justify-center space-x-1.5 transition">
                        <span>방문하기</span>
                        <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                </div>
            `).join('');

            lucide.createIcons();
        };

        window.selectCategory = function(cat) {
            state.currentCategory = cat;
            renderCategories();
            renderBookmarks();
        };

        window.togglePin = function(id) {
            state.bookmarks = state.bookmarks.map(b => b.id === id ? {...b, pinned: !b.pinned} : b);
            saveToCloud();
            renderBookmarks();
        };

        window.deleteBookmark = function(id) {
            if (confirm('이 링크를 삭제하시겠습니까?')) {
                state.bookmarks = state.bookmarks.filter(b => b.id !== id);
                saveToCloud();
                renderBookmarks();
            }
        };

        window.handleSaveBookmark = function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const title = document.getElementById('bmTitle').value;
            const url = document.getElementById('bmUrl').value;
            const category = document.getElementById('bmCategory').value;
            const desc = document.getElementById('bmDesc').value;

            if (editId) {
                state.bookmarks = state.bookmarks.map(b => b.id === editId ? {...b, title, url, category, desc} : b);
            } else {
                state.bookmarks.push({
                    id: Date.now().toString(),
                    title, url, category, desc, pinned: false
                });
            }
            saveToCloud();
            closeModal();
            renderBookmarks();
        };

        window.openAddModal = function() {
            document.getElementById('modalTitle').textContent = '새 링크 추가';
            document.getElementById('bookmarkForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('bookmarkModal').classList.remove('hidden');
        };

        window.openEditModal = function(id) {
            const bm = state.bookmarks.find(b => b.id === id);
            if (!bm) return;
            document.getElementById('modalTitle').textContent = '링크 수정';
            document.getElementById('editId').value = bm.id;
            document.getElementById('bmTitle').value = bm.title;
            document.getElementById('bmUrl').value = bm.url;
            document.getElementById('bmCategory').value = bm.category;
            document.getElementById('bmDesc').value = bm.desc || '';
            document.getElementById('bookmarkModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('bookmarkModal').classList.add('hidden');
        };

        // Category Modal Handlers
        window.openCategoryModal = function() {
            renderCategoryManageList();
            document.getElementById('categoryModal').classList.remove('hidden');
        };

        window.closeCategoryModal = function() {
            document.getElementById('categoryModal').classList.add('hidden');
        };

        window.handleAddCategory = function() {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (name && !state.categories.includes(name)) {
                state.categories.push(name);
                input.value = '';
                saveToCloud();
                renderCategories();
                renderCategoryManageList();
            }
        };

        function renderCategoryManageList() {
            const list = document.getElementById('categoryManageList');
            list.innerHTML = state.categories.map(cat => {
                if (cat === '전체') return '';
                return `
                    <div class="flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-700/50 rounded-lg">
                        <span class="text-sm text-slate-700 dark:text-slate-200 font-medium">${cat}</span>
                        ${cat !== '기타' ? `
                            <button onclick="deleteCategory('${cat}')" class="text-xs text-rose-500 hover:text-rose-700 font-semibold">삭제</button>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        window.deleteCategory = function(catName) {
            if (confirm(`'${catName}' 카테고리를 삭제하시겠습니까? 해당 링크들은 '기타' 카테고리로 이동합니다.`)) {
                state.categories = state.categories.filter(c => c !== catName);
                state.bookmarks = state.bookmarks.map(b => b.category === catName ? {...b, category: '기타'} : b);
                if (state.currentCategory === catName) state.currentCategory = '전체';
                saveToCloud();
                renderCategories();
                renderBookmarks();
                renderCategoryManageList();
            }
        };

        // Auth Modal Handlers
        window.openAuthModal = function() {
            document.getElementById('authModal').classList.remove('hidden');
        };

        window.closeAuthModal = function() {
            document.getElementById('authModal').classList.add('hidden');
        };

        window.switchAuthTab = function(type) {
            const syncSec = document.getElementById('syncCodeSection');
            const emailSec = document.getElementById('emailAuthSection');
            const tabSyncBtn = document.getElementById('tabSyncBtn');
            const tabEmailBtn = document.getElementById('tabEmailBtn');

            if (type === 'sync') {
                syncSec.classList.remove('hidden');
                emailSec.classList.add('hidden');
                tabSyncBtn.className = "flex-1 py-2 text-xs font-semibold text-brand-500 border-b-2 border-brand-500";
                tabEmailBtn.className = "flex-1 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600";
            } else {
                syncSec.classList.add('hidden');
                emailSec.classList.remove('hidden');
                tabEmailBtn.className = "flex-1 py-2 text-xs font-semibold text-brand-500 border-b-2 border-brand-500";
                tabSyncBtn.className = "flex-1 py-2 text-xs font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600";
            }
        };

        window.copySyncCode = function() {
            navigator.clipboard.writeText(state.userId);
            alert('동기화 코드가 복사되었습니다!\n다른 기기에 이 코드를 입력하세요.');
        };

        window.applySyncCode = function() {
            const code = document.getElementById('targetSyncCode').value.trim();
            if (code) {
                state.userId = code;
                localStorage.setItem('my_sync_id', code);
                listenToCloudData(code);
                updateAuthUI(false);
                closeAuthModal();
                alert('해당 코드의 데이터로 연동되었습니다!');
            }
        };

        window.createNewSyncId = function() {
            const newId = 'sync_' + Math.random().toString(36).substr(2, 9);
            state.userId = newId;
            localStorage.setItem('my_sync_id', newId);
            saveToCloud();
            listenToCloudData(newId);
            updateAuthUI(false);
            alert('새 전용 동기화 코드가 생성되었습니다!');
        };

        window.handleSignUp = async function() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('회원가입 완료! 로그인되었습니다.');
                closeAuthModal();
            } catch (err) {
                alert('회원가입 오류: ' + err.message);
            }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return alert('이메일과 비밀번호를 입력해주세요.');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인 성공!');
                closeAuthModal();
            } catch (err) {
                alert('로그인 오류: ' + err.message);
            }
        };

        // Theme Toggle
        window.toggleTheme = function() {
            document.documentElement.classList.toggle('dark');
        };
    </script>
</body>
</html>
